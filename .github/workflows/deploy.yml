name: Publicar web de estudio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preparar web estática
        run: npm ci && npm run build:web
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web estática
        uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
